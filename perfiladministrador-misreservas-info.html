<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Detalle de reserva | Paletas de Hielo</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >
</head>

<body>
    <div id="header"></div>
    <main class="admin">

        <div class="admin__layout">

            <!-- SIDEBAR GLOBAL -->

            <div id="sidebar-admin"></div>

            <section
                class="admin-contenido detalle-reserva"
                aria-labelledby="titulo-reserva"
            >

                <!-- MIGAS DE PAN -->

                <nav
                    class="detalle-reserva__breadcrumb"
                    aria-label="Migas de pan"
                >

                    <a href="perfiladministrador.html">
                        Administrador
                    </a>

                    <span aria-hidden="true">/</span>

                    <a href="perfiladministrador-misreservas.html">
                        Mis reservas
                    </a>

                    <span aria-hidden="true">/</span>

                    <span aria-current="page">
                        Detalle
                    </span>

                </nav>

                <p id="mensaje-detalle" role="status">Cargando reserva...</p>
                <div id="contenido-reserva" hidden>
                <article class="reserva-resumen">

                    <div class="reserva-resumen__encabezado">

                        <div>

                            <p class="reserva-resumen__etiqueta">
                                Información de la reserva
                            </p>

                            <h1 id="titulo-reserva">
                                Detalle de reserva
                            </h1>

                        </div>

                        <span class="reserva-resumen__estado" id="estado-actual">—</span>

                    </div>

                    <div class="reserva-resumen__datos">

                        <div class="reserva-resumen__dato">

                            <span>
                                Tipo de evento
                            </span>

                            <strong data-campo="tipoEvento">—</strong>

                        </div>


                        <div class="reserva-resumen__dato">

                            <span>
                                Fecha
                            </span>

                            <strong data-campo="fechaEvento">—</strong>

                        </div>


                        <div class="reserva-resumen__dato">

                            <span>
                                Invitados
                            </span>

                            <strong data-campo="numeroInvitados">—</strong>

                        </div>


                        <div class="reserva-resumen__dato">

                            <span>
                                Producto solicitado
                            </span>

                            <strong data-campo="productoSolicitado">—</strong>

                        </div>

                    </div>


                    <form id="form-estado" class="reserva-campo">
                        <label for="reserva-estado">Estado de la reserva</label>
                        <select id="reserva-estado" class="pedido-card__select" disabled>
                            <option value="pendiente">Pendiente</option>
                            <option value="confirmada">Confirmada</option>
                            <option value="finalizada">Finalizada</option>
                            <option value="cancelada">Cancelada</option>
                        </select>
                        <button type="submit" class="reserva-resumen__correos" id="guardar-estado" disabled>Guardar estado</button>
                        <p id="mensaje-estado" role="status" aria-live="polite"></p>
                    </form>

                </article>

                <section
                    class="reserva-datos"
                    aria-labelledby="titulo-detalles-reserva"
                >

                    <header class="reserva-seccion__encabezado">

                        <h2 id="titulo-detalles-reserva">
                            Detalles de la reserva
                        </h2>

                        <div
                            class="reserva-seccion__linea"
                            aria-hidden="true"
                        ></div>

                    </header>


                    <div class="reserva-datos__formulario">

                        <!-- NOMBRE -->

                        <div class="reserva-campo reserva-campo--completo">

                            <label for="reserva-nombre">
                                Nombre del cliente
                            </label>

                            <input
                                id="reserva-nombre"
                                type="text"
                                value=""
                                readonly
                            >

                        </div>

                        <div class="reserva-campo reserva-campo--completo">

                            <label for="reserva-direccion">
                                Dirección del evento
                            </label>

                            <input
                                id="reserva-direccion"
                                type="text"
                                value=""
                                readonly
                            >

                        </div>

                        <div class="reserva-campo reserva-campo--completo">

                            <label for="reserva-correo">
                                Correo electrónico
                            </label>

                            <input
                                id="reserva-correo"
                                type="email"
                                value=""
                                readonly
                            >

                        </div>

                        <div class="reserva-campo">

                            <label for="reserva-telefono">
                                Teléfono
                            </label>

                            <input
                                id="reserva-telefono"
                                type="tel"
                                value=""
                                readonly
                            >

                        </div>
                        <div class="reserva-campo">

                            <label for="reserva-ciudad">
                                Código postal
                            </label>

                            <input
                                id="reserva-ciudad"
                                type="text"
                                value=""
                                readonly
                            >

                        </div>

                    </div>

                </section>

                <section
                    class="reserva-evento"
                    aria-labelledby="titulo-evento"
                >

                    <header class="reserva-seccion__encabezado">

                        <h2 id="titulo-evento">
                            Información del evento
                        </h2>

                        <div
                            class="reserva-seccion__linea"
                            aria-hidden="true"
                        ></div>

                    </header>


                    <div class="reserva-evento__grid">

                        <article class="reserva-evento__item">

                            <span>
                                Evento
                            </span>

                            <strong data-campo="tipoEvento">—</strong>

                        </article>


                        <article class="reserva-evento__item">

                            <span>
                                Fecha reservada
                            </span>

                            <strong data-campo="fechaEvento">—</strong>

                        </article>


                        <article class="reserva-evento__item">

                            <span>
                                Cantidad estimada
                            </span>

                            <strong data-campo="numeroInvitados">—</strong>

                        </article>

                    </div>

                </section>

                <section
                    class="reserva-proceso"
                    aria-labelledby="titulo-proceso-reserva"
                >

                    <header class="reserva-seccion__encabezado">

                        <h2 id="titulo-proceso-reserva">
                            Datos adicionales de la solicitud
                        </h2>

                        <div
                            class="reserva-seccion__linea"
                            aria-hidden="true"
                        ></div>

                    </header>


                    <div class="reserva-timeline" id="datos-adicionales"></div>


                </section>
                </div>
            </section>
        </div>
    </main>
    <div id="footer"></div>


    <!-- COMPONENTES -->

    <script src="js/components.js"></script>

<script type="module" src="js/reserva-detalle.js"></script>
</body>

</html>
